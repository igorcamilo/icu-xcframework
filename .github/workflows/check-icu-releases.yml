name: Check ICU releases

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-icu-releases
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.upstream.outputs.tag }}
      publish: ${{ steps.upstream.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          sparse-checkout: scripts
      - name: Update submodule, tag the snapshot, and create a draft release
        id: upstream
        env:
          PYTHONUNBUFFERED: '1'
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -B scripts/release.py check-upstream --branch "$DEFAULT_BRANCH" --rebuild

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    uses: igorcamilo/icu-xcframework/.github/workflows/release.yml@main
    with:
      tag: ${{ needs.check.outputs.tag }}
      rebuild: true
