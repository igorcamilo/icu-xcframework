name: Publish XCFramework

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and replace assets
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      rebuild:
        description: Rebuild and replace existing release assets
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      REBUILD: ${{ github.event_name == 'workflow_dispatch' || inputs.rebuild == true }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          submodules: recursive
          persist-credentials: false
      - name: Select the ICU revision pinned by the release tag
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          git fetch --depth=1 origin "refs/tags/$RELEASE_TAG"
          icu_revision="$(git rev-parse FETCH_HEAD:icu)"
          git -C icu fetch --depth=1 origin "$icu_revision"
          git -C icu checkout --detach "$icu_revision"
      - name: Inspect existing release assets
        id: release
        run: python3 -B scripts/release.py inspect --tag "$RELEASE_TAG"
      - name: Show selected Apple toolchain
        if: env.REBUILD == 'true' || steps.release.outputs.archive_exists != 'true'
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Build and verify one XCFramework for all Apple app platforms
        if: env.REBUILD == 'true' || steps.release.outputs.archive_exists != 'true'
        run: python3 -B scripts/build-icu.py --jobs 3 --parallel-builds 1
      - name: Upload release assets and update release notes
        run: |
          options=()
          if [[ "$REBUILD" == "true" ]]; then options+=(--rebuild); fi
          python3 -B scripts/release.py publish --tag "$RELEASE_TAG" "${options[@]}"
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/**/*.log
            dist/release-notes.md
            dist/ICU.xcframework/Verification.json
          if-no-files-found: ignore
          retention-days: 7
