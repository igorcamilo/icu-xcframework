name: Publish XCFramework

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and replace assets
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      rebuild:
        description: Rebuild and replace existing release assets
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
  REBUILD: ${{ github.event_name == 'workflow_dispatch' || inputs.rebuild == true }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      build: ${{ env.REBUILD == 'true' || steps.release.outputs.archive_exists != 'true' }}
      source: ${{ steps.release.outputs.source_commit }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          sparse-checkout: scripts
          persist-credentials: false
      - name: Inspect existing release assets
        id: release
        run: python3 -B scripts/release.py inspect --tag "$RELEASE_TAG" --resolve-source
      - name: Plan independent platform variants
        id: matrix
        run: |
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys
          sys.path.insert(0, "scripts")
          from apple_platforms import build_matrix
          print("matrix=" + json.dumps(build_matrix()))
          PY

  build:
    name: Build ${{ matrix.variant }}
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      ICU_FAMILY: ${{ matrix.family }}
      ICU_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          sparse-checkout: |
            scripts
            tests/consumers
          persist-credentials: false
      - name: Check out only the exact ICU commit and ICU4C subtree
        uses: actions/checkout@v7
        with:
          repository: unicode-org/icu
          ref: ${{ needs.prepare.outputs.source }}
          path: icu
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          sparse-checkout: icu4c
          persist-credentials: false
      - name: Show selected Apple toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Build and verify this platform variant using all runner CPUs
        run: |
          python3 -B scripts/build-icu.py \
            --platforms "$ICU_FAMILY" --variants "$ICU_VARIANT" \
            --jobs "$(sysctl -n hw.logicalcpu)" --parallel-builds 2
      - name: Transfer the verified variant to the publishing job
        uses: actions/upload-artifact@v7
        with:
          name: icu-part-${{ matrix.variant }}
          path: dist/
          if-no-files-found: error
          overwrite: true
          compression-level: 1
          retention-days: 1
      - name: Preserve variant build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-logs-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/**/*.log
            dist/ICU.xcframework/Verification.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [prepare, build]
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || needs.prepare.outputs.build != 'true')
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep current build/release tooling when rebuilding an older tag.
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          sparse-checkout: scripts
          persist-credentials: false
      - name: Download verified platform variants
        if: needs.prepare.outputs.build == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: icu-part-*
          path: parts
      - name: Assemble one XCFramework with all supported Apple platforms
        if: needs.prepare.outputs.build == 'true'
        run: python3 -B scripts/assemble_icu.py parts --output dist/ICU.xcframework
      - name: Upload release assets and update release notes
        run: |
          options=()
          if [[ "$REBUILD" == "true" ]]; then options+=(--rebuild); fi
          python3 -B scripts/release.py publish --tag "$RELEASE_TAG" "${options[@]}"
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/release-notes.md
            dist/ICU.xcframework/Verification.json
          if-no-files-found: ignore
          retention-days: 7
